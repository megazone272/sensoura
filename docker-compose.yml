version: '3.8'

services:
  # ==========================================
  # Redis - Job queue & caching
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: sensoura-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MQTT Broker - ESP32 communication
  # ==========================================
  mosquitto:
    image: eclipse-mosquitto:2-openssl
    container_name: sensoura-mqtt
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"  # Local-only WebSocket listener
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto.acl:/mosquitto/config/mosquitto.acl:ro
      - type: bind
        source: ${MOSQUITTO_PASSWORD_FILE:?Set MOSQUITTO_PASSWORD_FILE to the local password file}
        target: /mosquitto/config/passwd
        read_only: true
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?Set MQTT_USERNAME=sensoura}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD to match the broker password file}
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -u '$$MQTT_USERNAME' -P '$$MQTT_PASSWORD' -t sensoura/status/healthcheck -m ok"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # Backend API + Socket.IO
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: sensoura-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - "FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}"
      - "MQTT_USERNAME=${MQTT_USERNAME:?Set MQTT_USERNAME=sensoura}"
      - "MQTT_PASSWORD=${MQTT_PASSWORD:?Set MQTT_PASSWORD to match the broker password file}"
      - AI_MODEL_PATH=/app/models
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/models:/app/models
      - ./backend/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/ready"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ==========================================
  # AI Pipeline (data-integration / decision / prediction)
  # Separate process from the HTTP backend. Advisory only: it never writes
  # actuator commands. See docs/ai-pipeline.md.
  # ==========================================
  pipeline:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: sensoura-pipeline
    restart: unless-stopped
    command: ["node", "dist/ai/pipeline/index.js"]
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      - NODE_ENV=production
      - PIPELINE_ENABLED=true
      - PIPELINE_HOST=0.0.0.0
      - PIPELINE_PORT=3100
      - "PIPELINE_ADMIN_TOKEN=${PIPELINE_ADMIN_TOKEN:?Export a random PIPELINE_ADMIN_TOKEN before starting Compose}"
      - GREENHOUSE_TIMEZONE=Africa/Cairo
      # Append new predictions to the existing node; existing records are
      # never modified or deleted.
      - AI_LEGACY_PREDICTIONS_PATH=/Sensoura/aiPredictions
      - AI_LEGACY_PREDICTIONS_WRITE=true
      # The pipeline is advisory only and never actuates the pump.
      - AI_ALLOW_IRRIGATION_RECOMMENDATIONS=false
    env_file:
      - ./backend/.env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ==========================================
  # Frontend (Vite + React) - Development
  # ==========================================
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sensoura-frontend-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
      - VITE_WS_URL=ws://localhost:3000
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN:-}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/package.json:/app/package.json
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - development

  # ==========================================
  # Frontend - Production (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_BASE_PATH: /
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
    container_name: sensoura-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - production

  # ==========================================
  # Grafana - Metrics visualization
  # ==========================================
  grafana:
    image: grafana/grafana:10-alpine
    container_name: sensoura-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - "GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?Export GRAFANA_ADMIN_USER before enabling monitoring}"
      - "GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Export GRAFANA_ADMIN_PASSWORD before enabling monitoring}"
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - backend
    profiles:
      - monitoring

  # ==========================================
  # Prometheus - Metrics collection
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: sensoura-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    profiles:
      - monitoring

volumes:
  redis_data:
  mosquitto_data:
  mosquitto_logs:
  grafana_data:
  prometheus_data:
  frontend_node_modules:

networks:
  default:
    name: sensoura-network
