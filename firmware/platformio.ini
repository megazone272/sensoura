; SENSOURA — ESP32-S3 N16R8 firmware (PlatformIO / Arduino)
; NASA Competition — Smart Agriculture IoT node
;
; Wiring (ESP32-S3-DevKitC / XIAO ESP32S3 friendly, ADC1-only pins for analog
; sensors so WiFi does not block them):
;   DHT11 data      -> GPIO4
;   DS18B20 data    -> GPIO5   (4.7k pull-up to 3V3)
;   Soil moisture AO-> GPIO6   (ADC1_CH5)
;   MQ135 AO        -> GPIO7   (ADC1_CH6)
;   Photoresistor   -> GPIO1   (ADC1_CH0, with 10k divider)
;   BMP180 SDA      -> GPIO8
;   BMP180 SCL      -> GPIO9
;   Relay (pump)    -> GPIO10  (active LOW relay module)
;   Buzzer          -> GPIO11
;   Green LED       -> GPIO12
;   Red LED         -> GPIO13

[env:esp32s3_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    -DFIRMWARE_VERSION=\"1.0.0\"

lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    milesburton/DallasTemperature@^3.11.0
    paulstoffregen/OneWire@^2.3.8
    adafruit/Adafruit BMP085 Library@^1.2.2
    bblanchon/ArduinoJson@^7.1.0
