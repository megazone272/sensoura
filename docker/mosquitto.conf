# Mosquitto Configuration for SENSOURA
# NASA Competition Grade

# Persistence
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S

# Listeners
listener 1883
protocol mqtt
allow_anonymous true

# WebSocket listener for web clients
listener 9001
protocol websockets
allow_anonymous true

# Message size limits
message_size_limit 1048576

# Connection limits
max_connections -1
max_inflight_messages 100
max_queued_messages 1000

# Topic restrictions (optional - for production)
# pattern write sensoura/#
# pattern read sensoura/#

# Keep alive
ping_interval 60
ping_timeout 30