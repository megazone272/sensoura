global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    mission: 'sensoura'
    phase: 'lunar_analog'
    team: 'mission-49'

scrape_configs:
  - job_name: 'sensoura-backend'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
    # Run node-exporter on host for system metrics

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []
